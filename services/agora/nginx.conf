# Only an explicit successful API policy can make a conversation indexable.
map "$conversation_indexing_status:$conversation_indexing_policy" $conversation_robots_tag {
  default "noindex, nofollow";
  "200:index" "";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_static on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_proxied any;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;

  # Set Cache-Control headers for static files
  # location ~* \.(jpg|jpeg|gif|png|svg|webp|js|css|eot|otf|ttf|ttc|woff|woff2|font\.css)$ {
  #   expires 7d; # Equivalent to "max-age=604800"
  #   add_header Cache-Control "immutable, max-age=604800";
  #   try_files $uri =404;
  # }

  # This is necessary otherwise it doesn't load immediately, I have to reload X times
  location /favicon.ico {
    try_files $uri =404;
    add_header Cache-Control "immutable, max-age=604800";
    add_header Content-Type "image/x-icon";
  }

  # Specific rule for handling /assets/*-No.css files
  # This is necessary otherwise it doesn't load immediately, I have to reload X times
  location ~* /assets/.*-No\.css$ {
    try_files $uri =404;
    add_header Cache-Control "immutable, max-age=604800";
    add_header Content-Type "text/css";
  }

  # Deployment bookkeeping shares the persistent assets volume but is not public.
  location ^~ /assets/.asset-state {
    return 404;
  }

  location = /_conversation-indexing {
    internal;
    # Docker DNS is resolved per request so API restarts do not leave a stale IP.
    resolver 127.0.0.11 valid=30s;
    set $indexing_api "http://api:8080";
    proxy_pass $indexing_api/api/v1/conversation/indexing;
    proxy_method POST;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_cache off;
    proxy_set_header Content-Type application/json;
    proxy_set_body '{"conversationSlugId":"$conversation_indexing_slug"}';
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  # Covers main, analysis, embed, onboarding, and project-scoped conversation URLs.
  location ~* "^/(?:project/[^/]+/)?conversation/(?<indexing_slug>[A-Za-z0-9_-]{1,10})(?:/|$)" {
    set $conversation_indexing_slug $indexing_slug;
    auth_request /_conversation-indexing;
    auth_request_set $conversation_indexing_status $upstream_status;
    auth_request_set $conversation_indexing_policy $upstream_http_x_conversation_indexing;
    add_header X-Robots-Tag $conversation_robots_tag always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires 0 always;
    # A successful file lookup stays in this location, preserving its headers.
    try_files /index.html =404;
  }

  # Serve static files directly if they exist
  location ~* \.(js|css|jpg|jpeg|gif|png|svg|webp|eot|otf|ttf|ttc|woff|woff2|json|ico)$ {
    try_files $uri =404;
    add_header Cache-Control "immutable, max-age=604800";
  }

  # Recipient action paths contain bearer capabilities. Keep their page shell
  # private and prevent it from loading telemetry or unrelated origins.
  location ~ ^/email-updates/(unsubscribe|preferences|report)/[^/]+/?$ {
    # This protects the application nginx log. Any upstream CDN or load balancer
    # must independently exclude or redact these capability-bearing request URIs.
    access_log off;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires 0;
    add_header Referrer-Policy "no-referrer";
    add_header X-Robots-Tag "noindex, nofollow";
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'";
    try_files $uri $uri/ /index.html =404;
  }

  # all routes use index.html directly
  location / {
    # See: https://quasar.dev/quasar-cli-vite/developing-spa/deploying/#important-hosting-configuration
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires 0;
    try_files $uri $uri/ /index.html =404;
  }
}
